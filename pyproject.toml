[project]
name = "earthranger-cli"
version = "0.1.0"
description = "CLI for creating and editing EarthRanger event categories, choices, and v2 event types, and posting events."
requires-python = ">=3.11"
dependencies = [
    "earthranger-client>=1.16.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
er = "earthranger_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthranger_cli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
