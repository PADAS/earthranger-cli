# Example spec for `er-events apply` — one category, one event type
# exercising every supported field type.
#
# Slugs (category value, event type values, field keys, option values)
# must match [a-z0-9_]+. Quote anything YAML might reinterpret
# (e.g. "no", "1.10") — see "Why YAML?" in the README.

category:
  value: addaxai_connect
  display: AddaxAI Connect

event_types:
  - value: addaxai_connect_detection
    display: AddaxAI Connect Detection
    icon_id: cameratrap_rep          # optional; must exist on your ER site
    fields:
      - key: addaxai_connect_species
        label: Species
        type: select             # becomes shared Choice records + a $ref
        options:
          - {value: elephant, display: Elephant}
          - lion                 # shorthand: value=lion, display="Lion"
          - {value: giraffe, display: Giraffe}
      - key: addaxai_connect_scientific_name
        label: Scientific Name
        type: string
      - key: addaxai_connect_category
        label: AddaxAI Connect Category
        type: string
      - key: addaxai_connect_count
        label: Count
        type: number
        min: 0
        max: 100
      - key: addaxai_connect_confidence
        label: Confidence
        type: number
        min: 0.0
        max: 1.0
      - key: addaxai_connect_camera_id
        label: AddaxAI Connect Camera ID
        type: string
      - key: addaxai_connect_site_name
        label: AddaxAI Connect Site Name
        type: string
      - key: addaxai_connect_link
        label: AddaxAI Connect Link
        type: url
    required: [addaxai_connect_species]
